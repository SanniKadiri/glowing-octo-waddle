services:
  web:
    build: .
    environment:
      ACTION_REVIEW_KEY: ${ACTION_REVIEW_KEY:?Set ACTION_REVIEW_KEY}
      DATABASE_URL: postgres://action_review:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/action_review?sslmode=disable
    ports:
      - "127.0.0.1:${ACTION_REVIEW_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: action_review
      POSTGRES_USER: action_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U action_review -d action_review"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped
volumes:
  pgdata:
